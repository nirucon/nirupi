# NIRU Noir — aerc
[general]
default-save-path = ~/Downloads
term = tmux-256color

[ui]
styleset-name = nirupi
msglist-date-format = "2006-01-02 15:04"
index-format = "%D %-17.17n %Z %s"
timestamp-format = "2006-01-02 15:04"
this-day-time-format = "15:04"
this-week-time-format = "Mon 15:04"
this-year-time-format = "02 Jan"
message-id-format = "niru"

[viewer]
alternatives = text/plain,text/html
show-headers = false

[compose]
from = ""
