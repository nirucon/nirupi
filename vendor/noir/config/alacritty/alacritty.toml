# Alacritty Configuration for Nicklas Rudolfsson
# https://github.com/nirucon
# Theme: NIRU Noir — muted graphite and legible semantic ANSI colors
# Location: ~/.config/alacritty/alacritty.toml

[env]
TERM = "alacritty"

[window]
# Minimal, even padding that complements DWM's aesthetic
padding.x = 6
padding.y = 6
dynamic_padding = true
decorations = "Full"
opacity = 0.95  # 1.0 = fully opaque (change to e.g. 0.95 for subtle transparency)
dynamic_title = true

# Wayland users can set:
# [window]
# startup_mode = "Windowed"  # or "Maximized"/"Fullscreen"
# blur = true                # works if your compositor supports it

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# Fine-tuning if characters appear too compact
# [font.offset]
# x = 0
# y = 0

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Off"

[bell]
animation = "EaseOutExpo"
duration = 0        # 0 = silent, no flash
color = "0x5a5a60"  # only used if duration > 0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[mouse]
hide_when_typing = true

# --------- COLORS (theme-driven) ----------
# Colours are generated from the active palette and imported. Do not set
# colours here: `nirupi theme apply` (and Super+Ctrl+t) rewrites the import.
[general]
import = ["~/.config/nirupi/theme/alacritty.toml"]

# --------- Efficient Keybindings ----------
# Copy/paste, zoom, new window, etc.

# Copy selected text
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

# Paste from clipboard
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

# Increase font size
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

# Decrease font size
[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

# Reset font size to default
[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

# Spawn new Alacritty instance (useful in DWM)
[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

# Quick screenshot with grim/slurp (if available in PATH)
# [[keyboard.bindings]]
# key = "S"
# mods = "Control|Shift"
# command = { program = "grimshot", args = ["savecopy", "area"] }
