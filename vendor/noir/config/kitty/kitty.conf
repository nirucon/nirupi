# =========================================================
# KITTY CONF — NIRU (theme-driven)
# All colours are generated from the active palette and pulled in
# from ~/.config/nirupi/theme/kitty.conf by `nirupi theme apply`.
# Switch themes with Super+Ctrl+t (nirupi theme menu).
# =========================================================

include ${HOME}/.config/nirupi/theme/kitty.conf

# -------------------------
# Fonts
# -------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

adjust_line_height  1
adjust_column_width 0

# -------------------------
# Window
# -------------------------
remember_window_size yes
initial_window_width 1200
initial_window_height 760
window_padding_width 10
placement_strategy center

# -------------------------
# Transparency
# -------------------------
background_opacity 0.85
dynamic_background_opacity yes

# -------------------------
# Borders (colours are themed)
# -------------------------
window_border_width   1
draw_minimal_borders  yes

# -------------------------
# Tabs (colours are themed)
# -------------------------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_separator " ┇ "
tab_title_template "{title}"

# -------------------------
# Links / scrollback
# -------------------------
underline_hyperlinks always

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# -------------------------
# Bell
# -------------------------
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no

# -------------------------
# Mouse / clipboard
# -------------------------
copy_on_select yes
strip_trailing_spaces smart
focus_follows_mouse no
mouse_hide_wait 2.0

# -------------------------
# Performance
# -------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# -------------------------
# Shell integration
# -------------------------
shell_integration enabled

# -------------------------
# Optional but useful
# -------------------------
allow_remote_control yes
confirm_os_window_close 0
disable_ligatures never

# -------------------------
# Keybinds
# -------------------------
map ctrl+shift+f5 load_config_file

map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

map ctrl+shift+enter new_window
map ctrl+shift+w close_window
