# NIRU — tmux (colours are generated from the active palette)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,*:Tc"
set -g truecolor on
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 10
set -g mouse on

set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Theme colours generated from the active palette (nirupi theme apply).
source-file -q ~/.config/nirupi/theme/tmux.conf
