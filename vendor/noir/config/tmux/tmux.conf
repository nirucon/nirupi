# NIRU Noir — tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,*:Tc"
set -g truecolor on
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 10
set -g mouse on

set -g status-style "bg=#0f0f10,fg=#a8a8a8"
set -g status-left "#[fg=#0f0f10,bg=#819eb5,bold] #S #[default] "
set -g status-left-length 40
set -g status-right "#[fg=#a8a8a8]%Y-%m-%d #[fg=#e5e5e5]%H:%M #[default]"
set -g status-right-length 60
setw -g window-status-current-style "fg=#e5e5e5,bg=#2a2a2d,bold"
setw -g window-status-style "fg=#a8a8a8,bg=#0f0f10"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

setw -g pane-border-style "fg=#2a2a2d"
setw -g pane-active-border-style "fg=#5a5a60"
set -g message-style "bg=#3a3a3d,fg=#e5e5e5"
set -g message-command-style "bg=#3a3a3d,fg=#e5e5e5"
setw -g mode-style "bg=#3a3a3d,fg=#e5e5e5"
