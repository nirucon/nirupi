name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-debian:
    name: smoke + build (debian stable)
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - name: Bootstrap CA certificates and git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git python3 sudo diffutils shellcheck passwd \
            libx11-dev libxcb1-dev libx11-xcb-dev libxcb-res0-dev libxft-dev \
            libxinerama-dev libxext-dev libxrandr-dev libimlib2-dev \
            libfontconfig1-dev libfreetype-dev pkg-config
      - name: Bash syntax + shellcheck
        run: |
          for f in install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* vendor/noir/local/bin/*.sh tests/*.sh tools/*.sh; do
            bash -n "$f"
          done
          shellcheck --severity=error \
            install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* \
            vendor/noir/local/bin/*.sh tests/*.sh tools/*.sh
      - name: Package manifest (Debian)
        run: |
          tools/package-list.sh debian base | while read -r p; do
            [ -n "$p" ] || continue
            apt-cache show "$p" >/dev/null || { echo "missing Debian package: $p" >&2; exit 1; }
          done
      - name: Build suckless
        run: |
          for app in dwm dmenu st slock; do
            make -C "vendor/suckless/$app" -j2
          done
      - name: Smoke tests (non-root)
        run: |
          useradd -m -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && bash tests/smoke.sh"

  smoke-arch:
    name: smoke + build (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git python sudo diffutils shellcheck \
            libx11 libxcb libxft libxinerama libxext libxrandr imlib2 \
            fontconfig freetype2 pkgconf
      - uses: actions/checkout@v4
      - name: Bash syntax + shellcheck
        run: |
          for f in install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* vendor/noir/local/bin/*.sh tests/*.sh tools/*.sh; do
            bash -n "$f"
          done
          shellcheck --severity=error \
            install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* \
            vendor/noir/local/bin/*.sh tests/*.sh tools/*.sh
      - name: Package manifest (Arch)
        run: |
          tools/package-list.sh arch base | while read -r p; do
            [ -n "$p" ] || continue
            pacman -Si "$p" >/dev/null || { echo "missing Arch package: $p" >&2; exit 1; }
          done
      - name: Build suckless
        run: |
          for app in dwm dmenu st slock; do
            make -C "vendor/suckless/$app" -j2
          done
      - name: Smoke tests (non-root)
        run: |
          useradd -m -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && bash tests/smoke.sh"

  smoke-void:
    name: smoke + build (voidlinux)
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    steps:
      - name: Bootstrap
        run: |
          for d in /etc/xbps.d /usr/share/xbps.d; do
            [ -d "$d" ] && sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$d"/*.conf || true
          done
          xbps-install -Suy
          xbps-install -Sy git libstdc++ \
            base-devel python3 diffutils shadow findutils sudo shellcheck \
            libX11-devel libxcb-devel libXft-devel libXinerama-devel \
            libXext-devel libXrandr-devel imlib2-devel fontconfig-devel freetype-devel pkg-config
      - uses: actions/checkout@v4
      - name: Bash syntax + shellcheck
        run: |
          for f in install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* vendor/noir/local/bin/*.sh tests/*.sh tools/*.sh; do
            bash -n "$f"
          done
          shellcheck --severity=error \
            install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* \
            vendor/noir/local/bin/*.sh tests/*.sh tools/*.sh
      - name: Package manifest (Void)
        run: |
          xbps-install -S
          tools/package-list.sh void base | while read -r p; do
            [ -n "$p" ] || continue
            xbps-query -R "$p" >/dev/null || { echo "missing Void package: $p" >&2; exit 1; }
          done
      - name: Build suckless
        run: |
          for app in dwm dmenu st slock; do
            make -C "vendor/suckless/$app" -j2
          done
      - name: Smoke tests (non-root)
        run: |
          useradd -m -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && bash tests/smoke.sh"
