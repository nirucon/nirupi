name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-debian:
    name: smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y python3 shellcheck
      - name: Bash syntax
        run: |
          for f in install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* vendor/noir/local/bin/*.sh tests/*.sh; do
            bash -n "$f"
          done
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: shellcheck (errors only)
        run: |
          shellcheck --severity=error \
            install.sh runtime-session.sh lib/*.sh runtime/nirupi runtime/nirupi-* \
            vendor/noir/local/bin/*.sh tests/*.sh

  smoke-arch:
    name: smoke (archlinux container)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pacman -Sy --noconfirm --needed python sudo diffutils
      - name: Smoke tests (non-root, as on a real install)
        run: |
          useradd -m -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && bash tests/smoke.sh"

  smoke-void:
    name: smoke (voidlinux container)
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    steps:
      - name: Bootstrap (default mirror, git, libstdc++ for checkout)
        run: |
          for d in /etc/xbps.d /usr/share/xbps.d; do
            [ -d "$d" ] && sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$d"/*.conf || true
          done
          xbps-install -Suy xbps
          xbps-install -Sy git libstdc++
      - uses: actions/checkout@v4
      - name: Install tools
        run: xbps-install -Sy bash python3 diffutils shadow findutils sudo
      - name: Smoke tests (non-root, as on a real install)
        run: |
          useradd -m -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && bash tests/smoke.sh"
